
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini README Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">AI-POWERED DEVELOPER TOOL</p>
      <h1>README Generator ✨</h1>
      <p class="subtitle">
        Turn your project details into a professional README with Gemini AI.
      </p>
    </header>

    <form id="readme-form">
      <label for="projectName">Project Name</label>
      <input
        type="text"
        id="projectName"
        name="projectName"
        placeholder="e.g. Student Feedback System"
        required
      />

      <label for="description">Project Description</label>
      <textarea
        id="description"
        name="description"
        rows="4"
        placeholder="What does your project do?"
        required
      ></textarea>

      <label for="features">Key Features</label>
      <textarea
        id="features"
        name="features"
        rows="5"
        placeholder="Enter each feature on a new line"
        required
      ></textarea>

      <label for="technologies">Technologies Used</label>
      <input
        type="text"
        id="technologies"
        name="technologies"
        placeholder="e.g. HTML, CSS, JavaScript, Node.js"
        required
      />

      <button type="submit" id="generate-btn">
        Generate README
      </button>
    </form>

    <section id="result-section" hidden>
      <h2>Generated README</h2>
      <pre id="readme-output"></pre>
      <button type="button" id="copy-btn">Copy README</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
